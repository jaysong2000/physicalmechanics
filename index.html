
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical Mechanics Demo</title>
    <style>
        :root {
            --bg-space: #090d16;
            --bg-card: #151b26;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-green: #10b981;
            --border-color: #263147;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-space);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .interactive-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            max-width: 1100px;
            width: 100%;
            margin: auto;
        }

        @media (max-width: 768px) {
            .interactive-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .panel-header {
            margin-bottom: 16px;
        }

        .panel-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-header h2::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--accent-cyan);
            border-radius: 2px;
        }

        .canvas-container, .macro-display {
            background-color: #0b0f17;
            border: 1px solid #1e293b;
            border-radius: 12px;
            position: relative;
            width: 100%;
            height: 280px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .space-capsule {
            position: absolute;
            top: 50%;
            right: 25%;
            transform: translateY(-50%);
            width: 110px;
            height: 130px;
            z-index: 2;
            transition: filter 0.2s ease;
        }

        #capsule-body {
            transition: fill 0.3s ease;
        }

        .shockwave {
            position: absolute;
            top: 50%;
            right: calc(25% + 35px);
            transform: translateY(-50%);
            width: 150px;
            height: 220px;
            border-radius: 50%;
            border-left: 6px solid rgba(255, 255, 255, 0.2);
            filter: blur(4px);
            transition: all 0.1s ease;
            z-index: 1;
        }

        .controls-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .slider-wrapper, .select-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .slider-labels, .select-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .slider-name, .select-name {
            color: var(--text-muted);
        }

        .slider-value, .select-value {
            color: var(--accent-cyan);
            font-family: monospace;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #1e293b;
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent-cyan);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        select {
            background-color: #1e293b;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            width: 100%;
            transition: border-color 0.2s ease;
        }

        select:focus {
            border-color: var(--accent-cyan);
        }

        .metrics-dashboard {
            margin-top: auto;
            padding-top: 16px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            border-top: 1px solid var(--border-color);
        }

        .metric-card {
            background-color: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 2px;
            font-family: monospace;
            transition: color 0.2s ease;
        }

        .status-banner {
            grid-column: span 2;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        @keyframes shake {
            0% { transform: translateY(-50%) translateX(0); }
            25% { transform: translateY(-51%) translateX(-1px); }
            75% { transform: translateY(-49%) translateX(1px); }
            100% { transform: translateY(-50%) translateX(0); }
        }

        .failing-structure {
            animation: shake 0.15s infinite;
        }
    </style>
</head>
<body>

    <div class="interactive-container">
        <div class="panel">
            <div class="panel-header">
                <h2>The Small Scale</h2>
            </div>
            
            <div class="canvas-container">
                <canvas id="microCanvas"></canvas>
            </div>

            <div class="controls-group">
                <div class="slider-wrapper">
                    <div class="slider-labels">
                        <span class="slider-name">Average Atom Velocity</span>
                        <span class="slider-value" id="val-speed">700 m/s</span>
                    </div>
                    <input type="range" id="slide-speed" min="100" max="1500" value="700" step="10">
                </div>

                <div class="slider-wrapper">
                    <div class="slider-labels">
                        <span class="slider-name">Individual Atom Mass</span>
                        <span class="slider-value" id="val-size">28 u</span>
                    </div>
                    <input type="range" id="slide-size" min="9" max="70" value="28" step="1">
                </div>

                <div class="slider-wrapper">
                    <div class="slider-labels">
                        <span class="slider-name">Number of Particles</span>
                        <span class="slider-value" id="val-density">65 Particles</span>
                    </div>
                    <input type="range" id="slide-density" min="10" max="120" value="65">
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>The Large Scale</h2>
            </div>

            <div class="macro-display">
                <svg class="space-capsule" id="spaceCapsule" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path id="capsule-body" d="M10 70 C 10 30, 90 30, 90 70 L 75 100 L 25 100 Z" fill="#64748b" stroke="#475569" stroke-width="3"/>
                    <path d="M35 60 C 35 50, 65 50, 65 60 Z" fill="#1e293b"/>
                    <circle cx="50" cy="80" r="6" fill="#1e293b" opacity="0.4"/>
                </svg>
                <div class="shockwave" id="shockwave"></div>
            </div>

            <div class="controls-group" style="margin-top: 16px; margin-bottom: 16px;">
                <div class="select-wrapper">
                    <div class="select-labels">
                        <span class="select-name">Select Heat Shield Material</span>
                        <span class="select-value" id="val-material-limit">Max: 1650°C</span>
                    </div>
                    <select id="select-material">
                        <option value="aluminum">Aluminum Alloy</option>
                        <option value="titanium" selected>Titanium Alloy</option>
                        <option value="carbon">Reinforced Carbon Composite</option>
                    </select>
                </div>
            </div>

            <div class="metrics-dashboard">
                <div class="metric-card">
                    <div class="metric-label">Friction</div>
                    <div class="metric-value" id="metric-friction">Medium</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Shield Temp</div>
                    <div class="metric-value" id="metric-temp">25°C</div>
                </div>
                <div class="status-banner" id="status-banner">
                    Status: Safe Orbit
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('microCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        resizeCanvas();

        let particles = [];
        
        const slideSpeed = document.getElementById('slide-speed');
        const slideDensity = document.getElementById('slide-density');
        const slideSize = document.getElementById('slide-size');
        
        const valSpeed = document.getElementById('val-speed');
        const valDensity = document.getElementById('val-density');
        const valSize = document.getElementById('val-size');

        const selectMaterial = document.getElementById('select-material');
        const valMaterialLimit = document.getElementById('val-material-limit');
        const capsuleBody = document.getElementById('capsule-body');
        const spaceCapsule = document.getElementById('spaceCapsule');
        
        const shockwave = document.getElementById('shockwave');
        const metricFriction = document.getElementById('metric-friction');
        const metricTemp = document.getElementById('metric-temp');
        const statusBanner = document.getElementById('status-banner');

        const materialsData = {
            aluminum: { name: "Aluminum Alloy", meltPoint: 1200, baseColor: "#94a3b8" },
            titanium: { name: "Titanium Alloy", meltPoint: 1650, baseColor: "#cbd5e1" },
            carbon: { name: "Carbon Composite", meltPoint: 3600, baseColor: "#27272a" }
        };

        class Particle {
            constructor(x, y, radius, physicalSpeed) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.radius = radius;
                
                const angle = Math.random() * Math.PI * 2;
                this.baseVx = Math.cos(angle);
                this.baseVy = Math.sin(angle);
                
                this.personalSpeedModifier = 0.6 + Math.random() * 0.8; 
                this.updateSpeed(physicalSpeed);
            }

            updateSpeed(physicalSpeed) {
                // Map physical speed range (100 - 1500) smoothly down to a renderable canvas speed vector step
                const normalizedSpeedScalar = physicalSpeed / 100;
                const speed = normalizedSpeedScalar * this.personalSpeedModifier * 1.3;
                this.vx = this.baseVx * speed;
                this.vy = this.baseVy * speed;
                this.assignColor();
            }

            assignColor() {
                const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (currentSpeed > 13) {
                    this.color = '#ef4444';
                } else if (currentSpeed > 7) {
                    this.color = '#f97316';
                } else {
                    this.color = '#06b6d4';
                }
            }

            move() {
                if (Math.random() < 0.04) {
                    const jitterAngle = (Math.random() - 0.5) * 0.5;
                    const cos = Math.cos(jitterAngle);
                    const sin = Math.sin(jitterAngle);
                    const newVx = this.vx * cos - this.vy * sin;
                    const newVy = this.vx * sin + this.vy * cos;
                    this.vx = newVx;
                    this.vy = newVy;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
                if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; }
                if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -1; }
                if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -1; }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                // Base shadow glow threshold check on normalized slider evaluation
                ctx.shadowBlur = (slideSpeed.value / 100) > 9 ? 6 : 0;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.closePath();
                ctx.shadowBlur = 0;
            }
        }

        function syncParticles() {
            const targetCount = parseInt(slideDensity.value);
            const currentSpeed = parseInt(slideSpeed.value);
            const physicalMassU = parseInt(slideSize.value);

            // Dynamically scale physical atomic mass values back down to visual element pixel radii (2 to 15)
            const renderRadius = ((physicalMassU - 9) / (70 - 9)) * (15 - 2) + 2;

            while (particles.length < targetCount) {
                particles.push(new Particle(null, null, renderRadius, currentSpeed));
            }
            if (particles.length > targetCount) {
                particles.length = targetCount;
            }

            particles.forEach(p => {
                p.radius = renderRadius;
                p.updateSpeed(currentSpeed);
            });
        }

        function updateMacroWorld() {
            const physicalVelocityMS = parseInt(slideSpeed.value);
            const physicalMassU = parseInt(slideSize.value);
            const density = parseInt(slideDensity.value);
            const selectedMatKey = selectMaterial.value;
            const activeMaterial = materialsData[selectedMatKey];

            // Normalize values back down to original math scale coordinates for calculation consistency
            const normalizedSpeed = physicalVelocityMS / 100;
            const normalizedSize = ((physicalMassU - 9) / (70 - 9)) * (15 - 2) + 2;

            const rawViscosityScore = normalizedSpeed * normalizedSize;
            let frictionLabel = "Low";
            
            if (rawViscosityScore > 130) {
                frictionLabel = "Extreme";
                metricFriction.style.color = 'var(--accent-red)';
            } else if (rawViscosityScore > 70) {
                frictionLabel = "High";
                metricFriction.style.color = 'var(--accent-orange)';
            } else if (rawViscosityScore > 30) {
                frictionLabel = "Medium";
                metricFriction.style.color = 'var(--accent-cyan)';
            } else {
                frictionLabel = "Low";
                metricFriction.style.color = 'var(--text-main)';
            }

            const simulatedTempCelsius = Math.floor((normalizedSpeed * normalizedSpeed * normalizedSize * (density / 12)) * 1.5 + 25);

            valSpeed.innerText = `${physicalVelocityMS} m/s`;
            valSize.innerText = `${physicalMassU} u`;
            valDensity.innerText = `${density} Atoms`;

            valMaterialLimit.innerText = `Max Limit: ${activeMaterial.meltPoint}°C`;

            metricFriction.innerText = frictionLabel;
            metricTemp.innerText = `${simulatedTempCelsius.toLocaleString()}°C`;

            const intensity = (normalizedSpeed / 15) * (density / 120);
            shockwave.style.borderLeftWidth = `${4 + (density / 15)}px`;
            
            capsuleBody.style.fill = activeMaterial.baseColor;

            if (simulatedTempCelsius > activeMaterial.meltPoint) {
                shockwave.style.borderColor = 'rgba(239, 68, 68, 0.8)';
                shockwave.style.boxShadow = `-${12 + normalizedSpeed * 2}px 0px ${22 + normalizedSpeed * 3}px rgba(239, 68, 68, 0.9)`;
                metricTemp.style.color = 'var(--accent-red)';
                
                capsuleBody.style.fill = '#ef4444';
                spaceCapsule.classList.add('failing-structure');
                spaceCapsule.style.filter = `drop-shadow(-8px 0px 12px rgba(239, 68, 68, 0.8))`;

                statusBanner.innerText = `${activeMaterial.name} is melting.`;
                statusBanner.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
                statusBanner.style.color = 'var(--accent-red)';
                statusBanner.style.border = '1px solid var(--accent-red)';
            } else {
                spaceCapsule.classList.remove('failing-structure');
                spaceCapsule.style.filter = 'none';

                if (simulatedTempCelsius > activeMaterial.meltPoint * 0.6) {
                    shockwave.style.borderColor = `rgba(249, 115, 22, ${0.4 + intensity * 0.5})`;
                    shockwave.style.boxShadow = `-${5 + normalizedSpeed}px 0px ${10 + normalizedSpeed * 2}px rgba(249, 115, 22, 0.6)`;
                    metricTemp.style.color = 'var(--accent-orange)';
                    
                    statusBanner.innerText = `${activeMaterial.name} is stressed, but holding`;
                    statusBanner.style.backgroundColor = 'rgba(249, 115, 22, 0.1)';
                    statusBanner.style.color = 'var(--accent-orange)';
                    statusBanner.style.border = '1px solid var(--accent-orange)';
                } else {
                    shockwave.style.borderColor = `rgba(6, 182, 212, ${0.2 + intensity * 0.3})`;
                    shockwave.style.boxShadow = `none`;
                    metricTemp.style.color = 'var(--accent-cyan)';
                    
                    statusBanner.innerText = `${activeMaterial.name} is completely chill.`;
                    statusBanner.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
                    statusBanner.style.color = 'var(--accent-green)';
                    statusBanner.style.border = '1px solid var(--accent-green)';
                }
            }
        }

        slideSpeed.addEventListener('input', () => { syncParticles(); updateMacroWorld(); });
        slideDensity.addEventListener('input', () => { syncParticles(); updateMacroWorld(); });
        slideSize.addEventListener('input', () => { syncParticles(); updateMacroWorld(); });
        selectMaterial.addEventListener('change', () => { updateMacroWorld(); });

        window.addEventListener('resize', () => {
            resizeCanvas();
            particles.forEach(p => {
                if (p.x > canvas.width) p.x = canvas.width - p.radius;
                if (p.y > canvas.height) p.y = canvas.height - p.radius;
            });
        });

        syncParticles();
        updateMacroWorld();

        function loop() {
            ctx.fillStyle = 'rgba(11, 15, 23, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.move();
                p.draw();
            });

            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
